name: Build Windows Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt (MinGW)
      uses: jurplel/install-qt-action@v4
      id: qt
      with:
        version: '6.6.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtmultimedia'

    - name: Debug Qt outputs
      shell: bash
      run: |
        echo "qt-path: '${{ steps.qt.outputs.qt-path }}'"
        echo "qt-install-path: '${{ steps.qt.outputs.qt-install-path }}'"
        ls -la /c/Qt/ 2>/dev/null || echo "No /c/Qt"
        ls -la C:/Qt/ 2>/dev/null || echo "No C:/Qt"

    - name: Find Qt and Setup Environment
      shell: bash
      run: |
        # Try action outputs first
        QT_PATH="${{ steps.qt.outputs.qt-path }}"
        if [ -z "$QT_PATH" ] || [ ! -d "$QT_PATH" ]; then
          QT_PATH="${{ steps.qt.outputs.qt-install-path }}"
        fi
        
        # Fallback: known locations
        if [ -z "$QT_PATH" ] || [ ! -d "$QT_PATH" ]; then
          for p in \
            "C:/Qt/6.6.1/mingw_64" \
            "/c/Qt/6.6.1/mingw_64" \
            "C:/Qt/6.6.1/win64_mingw" \
            "/c/Qt/6.6.1/win64_mingw"; do
            if [ -d "$p" ] && [ -f "$p/bin/qmake.exe" ]; then
              QT_PATH="$p"
              break
            fi
          done
        fi
        
        # Fallback: search
        if [ -z "$QT_PATH" ] || [ ! -d "$QT_PATH" ]; then
          QMAKE=$(find /c/Qt -name "qmake.exe" -type f 2>/dev/null | head -n 1)
          if [ -n "$QMAKE" ]; then
            QT_PATH=$(dirname "$QMAKE")
            QT_PATH=$(dirname "$QT_PATH")
          fi
        fi
        
        if [ -z "$QT_PATH" ] || [ ! -d "$QT_PATH" ]; then
          echo "ERROR: Qt not found!"
          exit 1
        fi
        
        echo "Found Qt at: $QT_PATH"
        echo "QT_PATH=$QT_PATH" >> $GITHUB_ENV

    - name: Configure CMake
      shell: bash
      run: |
        export PATH="$QT_PATH/mingw_64/bin:$PATH"
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$QT_PATH" \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++

    - name: Build
      shell: bash
      run: |
        export PATH="$QT_PATH/mingw_64/bin:$PATH"
        cmake --build build --config Release

    - name: Deploy Qt Dependencies (windeployqt)
      shell: bash
      run: |
        WINDEPLOYQT="$QT_PATH/bin/windeployqt.exe"
        echo "Using windeployqt: $WINDEPLOYQT"
        
        export PATH="$QT_PATH/mingw_64/bin:$PATH"
        
        # Find the executable
        EXE_PATH=$(find build -name "zer0-kristal.exe" -type f | head -n 1)
        if [ -z "$EXE_PATH" ]; then
          echo "ERROR: Executable not found!"
          exit 1
        fi
        echo "Found executable: $EXE_PATH"

        "$WINDEPLOYQT" --qmldir . --release --compiler-runtime "$EXE_PATH"

    - name: Archive Windows Build
      shell: bash
      run: |
        mkdir -p dist
        EXE_PATH=$(find build -name "zer0-kristal.exe" -type f | head -n 1)
        EXE_DIR=$(dirname "$EXE_PATH")
        echo "Copying from: $EXE_DIR"
        cp -r "$EXE_DIR"/* dist/ 2>/dev/null || true

        echo "Place ffmpeg.exe and ffprobe.exe in this folder (or in PATH) for audio decoding and duration parsing." > dist/README-windows.txt

        cd dist
        zip -r ../zer0-kristal-windows-x64.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zer0-kristal-windows-x64
        path: zer0-kristal-windows-x64.zip