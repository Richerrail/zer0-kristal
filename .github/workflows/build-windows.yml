name: Build Windows Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt (MinGW)
      uses: jurplel/install-qt-action@v4
      id: qt
      with:
        version: '6.6.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtmultimedia'

    - name: Find Qt and Setup Environment
      shell: pwsh
      run: |
        # Get Qt path from action output
        $qtPath = "${{ steps.qt.outputs.qt-path }}"
        $qtInstallPath = "${{ steps.qt.outputs.qt-install-path }}"
        
        Write-Host "qt-path: '$qtPath'"
        Write-Host "qt-install-path: '$qtInstallPath'"
        
        # Try action outputs first
        if ($qtPath -and (Test-Path $qtPath)) {
          $QT_PATH = $qtPath
        } elseif ($qtInstallPath -and (Test-Path $qtInstallPath)) {
          $QT_PATH = $qtInstallPath
        } else {
          # Known locations
          $candidates = @(
            "C:/Qt/6.6.1/mingw_64"
            "C:/Qt/6.6.1/win64_mingw"
          )
          foreach ($p in $candidates) {
            if (Test-Path "$p/bin/qmake.exe") {
              $QT_PATH = $p
              break
            }
          }
        }
        
        # Fallback: search
        if (-not $QT_PATH) {
          $qmake = Get-ChildItem -Path "C:/Qt" -Filter "qmake.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($qmake) {
            $QT_PATH = $qmake.Directory.Parent.FullName
          }
        }
        
        if (-not $QT_PATH -or -not (Test-Path $QT_PATH)) {
          Write-Error "ERROR: Qt not found!"
          exit 1
        }
        
        Write-Host "Found Qt at: $QT_PATH"
        "QT_PATH=$QT_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure CMake
      shell: pwsh
      run: |
        $env:PATH = "$env:QT_PATH/mingw_64/bin;$env:PATH"
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:QT_PATH" `
          -DCMAKE_C_COMPILER=gcc `
          -DCMAKE_CXX_COMPILER=g++

    - name: Build
      shell: pwsh
      run: |
        $env:PATH = "$env:QT_PATH/mingw_64/bin;$env:PATH"
        cmake --build build --config Release

    - name: Deploy Qt Dependencies (windeployqt)
      shell: pwsh
      run: |
        $WINDEPLOYQT = "$env:QT_PATH/bin/windeployqt.exe"
        Write-Host "Using windeployqt: $WINDEPLOYQT"
        
        $env:PATH = "$env:QT_PATH/mingw_64/bin;$env:PATH"
        
        # Find the executable
        $EXE_PATH = Get-ChildItem -Path "build" -Filter "zer0-kristal.exe" -Recurse | Select-Object -First 1
        if (-not $EXE_PATH) {
          Write-Error "ERROR: Executable not found!"
          exit 1
        }
        Write-Host "Found executable: $($EXE_PATH.FullName)"

        & $WINDEPLOYQT --qmldir . --release --compiler-runtime $EXE_PATH.FullName

    - name: Archive Windows Build
      shell: pwsh
      run: |
        $EXE_PATH = Get-ChildItem -Path "build" -Filter "zer0-kristal.exe" -Recurse | Select-Object -First 1
        $EXE_DIR = $EXE_PATH.Directory.FullName
        Write-Host "Copying from: $EXE_DIR"
        
        New-Item -ItemType Directory -Force -Path "dist" | Out-Null
        Copy-Item -Path "$EXE_DIR\*" -Destination "dist\" -Recurse -Force -ErrorAction SilentlyContinue
        
        "Place ffmpeg.exe and ffprobe.exe in this folder (or in PATH) for audio decoding and duration parsing." | Out-File -FilePath "dist/README-windows.txt" -Encoding utf8
        
        Compress-Archive -Path "dist\*" -DestinationPath "zer0-kristal-windows-x64.zip" -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zer0-kristal-windows-x64
        path: zer0-kristal-windows-x64.zip