name: Build Windows Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC / Build Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        tools: 'tools_cmake'
        modules: 'qtmultimedia'

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: bash
      run: |
        cmake --build build --config Release

    - name: Deploy Qt Dependencies (windeployqt)
      shell: bash
      run: |
        # Find windeployqt and run it on the executable
        WINDEPLOYQT=$(find /c/Qt -name "windeployqt.exe" | head -n 1)
        if [ -z "$WINDEPLOYQT" ]; then
          WINDEPLOYQT=$(find C:/Qt -name "windeployqt.exe" | head -n 1)
        fi
        echo "Using windeployqt: $WINDEPLOYQT"
        "$WINDEPLOYQT" --qmldir . --release --compiler-runtime build/zer0-kristal.exe

    - name: Archive Windows Build
      shell: bash
      run: |
        mkdir -p dist
        cp build/zer0-kristal.exe dist/
        # Copy Qt DLLs and plugins generated by windeployqt into dist
        cp -r build/*.dll dist/ 2>/dev/null || true
        cp -r build/platforms dist/ 2>/dev/null || true
        cp -r build/multimedia dist/ 2>/dev/null || true
        cp -r build/audio dist/ 2>/dev/null || true
        
        # Also include a README note about ffmpeg
        echo "Place ffmpeg.exe and ffprobe.exe in this folder (or in PATH) for audio decoding and duration parsing." > dist/README-windows.txt
        
        cd dist
        zip -r ../zer0-kristal-windows-x64.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zer0-kristal-windows-x64
        path: zer0-kristal-windows-x64.zip
