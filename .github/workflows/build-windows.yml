name: Build Windows Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC / Build Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      id: qt
      with:
        version: '6.6.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        tools: 'tools_cmake'
        modules: 'qtmultimedia'

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: bash
      run: |
        cmake --build build --config Release

    - name: Deploy Qt Dependencies (windeployqt)
      shell: bash
      run: |
        # The install-qt-action outputs the Qt path in steps.qt.outputs.qt-install-path
        QT_PATH="${{ steps.qt.outputs.qt-install-path }}"
        echo "Qt path from action output: $QT_PATH"
        
        WINDEPLOYQT="$QT_PATH/bin/windeployqt.exe"
        if [ ! -f "$WINDEPLOYQT" ]; then
          # Fallback: find it in common locations
          WINDEPLOYQT=$(find "$QT_PATH" -name "windeployqt.exe" 2>/dev/null | head -n 1)
        fi
        if [ ! -f "$WINDEPLOYQT" ]; then
          WINDEPLOYQT=$(find /c/Qt -name "windeployqt.exe" 2>/dev/null | head -n 1)
        fi
        if [ ! -f "$WINDEPLOYQT" ]; then
          WINDEPLOYQT=$(find C:/Qt -name "windeployqt.exe" 2>/dev/null | head -n 1)
        fi
        if [ ! -f "$WINDEPLOYQT" ]; then
          echo "ERROR: windeployqt not found!"
          exit 1
        fi
        echo "Using windeployqt: $WINDEPLOYQT"

        # Find the executable (Ninja puts it in build/ or build/Release/)
        EXE_PATH=$(find build -name "zer0-kristal.exe" -type f | head -n 1)
        if [ -z "$EXE_PATH" ]; then
          echo "ERROR: Executable not found!"
          exit 1
        fi
        echo "Found executable: $EXE_PATH"

        "$WINDEPLOYQT" --qmldir . --release --compiler-runtime "$EXE_PATH"

    - name: Archive Windows Build
      shell: bash
      run: |
        mkdir -p dist
        # Find the executable (windeployqt copies DLLs next to it)
        EXE_PATH=$(find build -name "zer0-kristal.exe" -type f | head -n 1)
        EXE_DIR=$(dirname "$EXE_PATH")
        echo "Copying from: $EXE_DIR"
        cp -r "$EXE_DIR"/* dist/ 2>/dev/null || true

        # Also include a README note about ffmpeg
        echo "Place ffmpeg.exe and ffprobe.exe in this folder (or in PATH) for audio decoding and duration parsing." > dist/README-windows.txt

        cd dist
        zip -r ../zer0-kristal-windows-x64.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zer0-kristal-windows-x64
        path: zer0-kristal-windows-x64.zip